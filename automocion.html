<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPACIO MÉXICO · Módulo Automoción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E17;
    --surface: #131A2A;
    --surface-2: #1A2338;
    --line: #232D42;
    --text: #E9EDF5;
    --text-dim: #8B93A7;
    --text-faint: #4E5871;
    --ciencias: #33D6A6;
    --espacial: #7C5CFF;
    --aero: #2FA8FF;
    --auto: #FF6A3D;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
  
  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(255,106,61,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,106,61,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 85%);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 85%);
    pointer-events: none;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }
  
  nav { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 9px; }
  .logo-dot { width: 9px; height: 9px; border-radius: 2px; background: linear-gradient(135deg, var(--espacial), var(--ciencias)); transform: rotate(45deg); }
  .back-btn { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); text-decoration: none; border: 1px solid var(--line); padding: 6px 14px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
  .back-btn:hover { color: var(--text); background: var(--surface); }

  header { position: relative; padding: 40px 230px 30px 0; min-height: 190px; }
  .mod-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(32px, 4vw, 48px); font-weight: 600; margin-bottom: 16px; }
  .welcome-box { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: var(--text-dim); border-left: 2px solid var(--auto); padding-left: 16px; margin-bottom: 40px; }
  .engine-visual { position: absolute; right: 0; top: 20px; width: 200px; height: 160px; pointer-events: none; }
  
  @keyframes piston-move {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(28px); }
  }
  @keyframes rod-tilt {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(14deg) translateY(12px); }
  }
  @keyframes crank-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes spark-flash {
    50% { opacity: 0.1; }
  }
  @media (max-width: 700px) { header { padding-right: 0; min-height: 0; } .engine-visual { position: relative; display: block; margin: -20px auto 4px; right: auto; top: auto; } }

  .search-container { position: relative; margin-bottom: 40px; }
  .search-box { width: 100%; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search-box:focus { border-color: var(--auto); }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; }
  .result-item { padding: 12px 18px; font-family: 'JetBrains Mono', monospace; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .result-item:hover { background: rgba(255,255,255,0.03); }
  .status-info { color: var(--auto); font-style: italic; }
  .status-found { color: var(--ciencias); }

  .mode-panel { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; position: relative; margin-bottom: 30px; }
  .mode-btn { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 16px; border-radius: 8px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; z-index: 2; }
  body[data-mode="explorador"] .mode-btn.explorador, body[data-mode="ingeniero"] .mode-btn.ingeniero { color: #04070d; }
  .mode-thumb { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(50% - 6px); border-radius: 8px; background: linear-gradient(120deg, var(--ciencias), var(--aero)); transition: transform .32s cubic-bezier(.65,0,.35,1); z-index: 1; }
  body[data-mode="ingeniero"] .mode-thumb { transform: translateX(100%); background: linear-gradient(120deg, var(--espacial), var(--auto)); }

  .content-section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 30px; margin-bottom: 60px; }
  .content-body { font-size: 15.5px; line-height: 1.75; color: var(--text-dim); }

  .temas-container { background-color: transparent; border-radius: 12px; padding: 10px 0; }
  .scroll-area { max-height: 380px; overflow-y: auto; direction: rtl; padding-left: 20px; }
  .lista-temas { direction: ltr; list-style: none; display: flex; flex-direction: column; padding: 0; margin: 0; }
  .tema-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; cursor: pointer; }
  .tema-item:last-child { border-bottom: none; }
  .tema-item:hover { background-color: rgba(255, 255, 255, 0.03); border-radius: 8px; }
  .tema-icono { background-color: #1E293B; color: var(--auto); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0; }
  .tema-titulo { color: #FFFFFF; margin: 0 0 4px 0; font-size: 16px; font-weight: 600; }
  .tema-desc { color: var(--text-dim); margin: 0; font-size: 13px; }
  
  .scroll-area::-webkit-scrollbar { width: 6px; }
  .scroll-area::-webkit-scrollbar-track { background: var(--surface-2); border-radius: 10px; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--ciencias), var(--auto));
    border-radius: 10px;
    box-shadow: inset 0 0 6px rgba(255, 106, 61, 0.5);
  }
</style>
</head>
<body data-mode="explorador">

  <div class="grid-bg"></div>
  <div class="wrap">
    <nav>
      <div class="logo"><span class="logo-dot"></span>ESPACIO MÉXICO</div>
      <a href="index.html" class="back-btn">← Volver al inicio</a>
    </nav>

    <header>
      <h1 class="mod-title">Módulo de Automoción</h1>
      <div class="welcome-box">
        Bienvenido al módulo de automoción. Aquí aprenderemos cómo es que pasamos de caminar y del uso de animales, a máquinas para movernos con libertad y eficiencia.
      </div>
      <svg class="engine-visual" viewBox="0 0 200 160" aria-hidden="true">
        <defs>
          <linearGradient id="metalPiston" x1="0" x2="1">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="50%" stop-color="#cbd5e1"/>
            <stop offset="100%" stop-color="#334155"/>
          </linearGradient>
          <linearGradient id="rodGrad" x1="0" x2="1">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
          </linearGradient>
          <filter id="glowAuto">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <path d="M 50 25 L 150 25 L 160 50 L 160 135 L 40 135 L 40 50 Z" fill="#111827" stroke="#334155" stroke-width="2"/>
        <rect x="70" y="32" width="60" height="95" rx="4" fill="#030712" stroke="#ff6a3d" stroke-width="1.2" opacity="0.8"/>
        <g style="animation: piston-move 1.2s ease-in-out infinite; transform-origin: 100px 50px;">
          <rect x="73" y="38" width="54" height="32" rx="3" fill="url(#metalPiston)" stroke="#f8fafc" stroke-width="1"/>
          <line x1="73" y1="44" x2="127" y2="44" stroke="#0f172a" stroke-width="1.5"/>
          <line x1="73" y1="50" x2="127" y2="50" stroke="#0f172a" stroke-width="1.5"/>
          <circle cx="100" cy="54" r="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        </g>
        <g style="animation: rod-tilt 1.2s ease-in-out infinite; transform-origin: 100px 54px;">
          <path d="M 96 54 L 93 105 L 107 105 L 104 54 Z" fill="url(#rodGrad)" stroke="#475569" stroke-width="1"/>
        </g>
        <g style="animation: crank-spin 1.2s linear infinite; transform-origin: 100px 115px;">
          <circle cx="100" cy="115" r="18" fill="none" stroke="#ff6a3d" stroke-width="3" opacity="0.9"/>
          <path d="M 85 115 A 15 15 0 0 0 115 115 Z" fill="#64748b"/>
          <circle cx="100" cy="100" r="6" fill="#f8fafc" filter="url(#glowAuto)"/>
        </g>
        <g filter="url(#glowAuto)" stroke="#ffd166" stroke-width="2" style="animation: spark-flash 0.6s steps(2,end) infinite;">
          <line x1="100" y1="32" x2="100" y2="20"/>
          <line x1="94" y1="25" x2="106" y2="25"/>
        </g>
      </svg>
    </header>

    <div class="search-container">
      <input type="text" class="search-box" id="searchBox" placeholder="Buscar tema en este módulo...">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="mode-panel" id="modePanel">
      <div class="mode-thumb"></div>
      <button class="mode-btn explorador" onclick="setMode('explorador')">EXPLORADOR</button>
      <button class="mode-btn ingeniero" onclick="setMode('ingeniero')">INGENIERO</button>
    </div>

    <section class="content-section">
      <div class="content-body" id="mainContent">
        <div class="temas-container">
          <div class="scroll-area">
            <ul class="lista-temas">
              <li class="tema-item" onclick="cargarContenido('motoresCombustion')">
                <div class="tema-icono">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="17" r="2.2"/><circle cx="17" cy="17" r="2.2"/><path d="M3 17h2l1.5-6h9L18 17h1"/><path d="M8 11l2-4h4l1 4"/></svg>
                </div>
                <div class="tema-info">
                  <h4 class="tema-titulo">Motores de Combustión</h4>
                  <p class="tema-desc">Ciclos de cuatro tiempos y eficiencia térmica</p>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
  let temaActualActivo = null;
  function setMode(mode) { 
    document.body.dataset.mode = mode; 
    if (temaActualActivo) {
      cargarContenido(temaActualActivo);
    }
  }
  const CURRENT_MODULE = 'automocion';

  const contenidoTemas = {
    motoresCombustion: {
      explorador: `
        <h2 style="color: var(--auto); margin-bottom: 15px;">Motores de Combustión</h2>
        <p>Los motores de combustión transforman la energía química del combustible en energía mecánica a través de explosiones controladas dentro de cilindros.</p>
      `,
      ingeniero: `
        <h2 style="color: var(--auto); margin-bottom: 15px;">Motores de Combustión (Análisis Técnico)</h2>
        <p>Análisis basado en el ciclo Otto y ciclo Diesel ideal, estudiando la relación de compresión, el trabajo indicado y la eficiencia térmica volumétrica.</p>
      `
    }
  };

  function cargarContenido(temaId) {
    temaActualActivo = temaId;
    const mainContent = document.getElementById('mainContent');
    const modoActual = document.body.dataset.mode;
    const tema = contenidoTemas[temaId];
    if (!tema) return;
    mainContent.innerHTML = `
      <button onclick="regresarLista()" class="back-btn" style="margin-bottom: 20px;">← Volver al temas</button>
      ${tema[modoActual]}
    `;
  }

  function regresarLista() { location.reload(); }

  const database = [
    { tema: "Mecánica orbital", modulo: "espacial", desarrollado: true },
    { tema: "Propulsión de cohetes", modulo: "espacial", desarrollado: true },
    { tema: "Sistemas en cohetes", modulo: "espacial", desarrollado: false },
    { tema: "Perfiles alares y sustentación", modulo: "aeronautico", desarrollado: true },
    { tema: "Motores a reacción", modulo: "aeronautico", desarrollado: false },
    { tema: "Motores de combustión", modulo: "automocion", desarrollado: true },
    { tema: "Transmisiones mecánicas", modulo: "automocion", desarrollado: false },
    { tema: "Ciclos termodinámicos", modulo: "ciencias", desarrollado: true },
    { tema: "Ciencia de materiales", modulo: "ciencias", desarrollado: false },
    { tema: "Propulsion y Empuje", modulo: "aeronautico", desarrollado: true }
  ];

  const searchBox = document.getElementById('searchBox');
  const searchResults = document.getElementById('searchResults');

  searchBox.addEventListener('input', () => {
    const query = searchBox.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    if (!query) { searchResults.style.display = 'none'; return; }
    const matches = database.filter(item => item.tema.toLowerCase().includes(query));
    if (matches.length === 0) {
      searchResults.innerHTML = `<div class="result-item status-info">Este tema aún no se ha desarrollado;0</div>`;
      searchResults.style.display = 'block';
      return;
    }
    matches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'result-item';
      if (item.modulo === CURRENT_MODULE) {
        if (item.desarrollado) {
          div.innerHTML = `<span class="status-found">✓ En este módulo:</span> ${item.tema}`;
          div.onclick = () => { searchResults.style.display = 'none'; };
        } else {
          div.innerHTML = `<span class="status-info">⚠ En este módulo:</span> ${item.tema} (Este tema aún no se ha desarrollado;0)`;
        }
      } else {
        div.innerHTML = `<span class="status-info">➔ Disponible en Módulo ${item.modulo.toUpperCase()}:</span> ${item.tema} (Regresa e ingresa al módulo correcto)`;
      }
      searchResults.appendChild(div);
    });
    searchResults.style.display = 'block';
  });

  document.addEventListener('click', (e) => {
    if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) { searchResults.style.display = 'none'; }
  });
</script>
</body>
</html>
